# gondr config. Copy to ~/.config/gondr/config.toml and edit.
[infisical]
# EU cloud. US cloud: https://app.infisical.com. Or your self-hosted URL.
url = "https://eu.infisical.com"
project = "<infisical project id>"

[infisical.credentials]
# source = "env" reads INFISICAL_UNIVERSAL_AUTH_CLIENT_ID and _SECRET
source = "keychain"
keychain_account = "gondr"
client_id_service = "infisical-client-id"
client_secret_service = "infisical-client-secret"

[layout]
repos_root = "~/repos"
prefix = "/repos"
shared = "/shared"
# Folders of deployed services, outside any repo, that `set` and `token mint` may also write with --path.
# service_roots = ["/services"]

# Repos whose Infisical folder does not follow their path. The longest match wins.
# [folders]
# "~/repos/acme/web-v2" = "/repos/acme/web"

[agent_vault]
binary = "agent-vault"
address = "http://agent-vault.example:14321"
default_vault = "shared"
grant_agents = ["my-agent"]
references_folder = "agent-vault"
token = { source = "keychain", account = "my-agent", service = "agent-vault-token" }
# token = { source = "env", name = "AGENT_VAULT_TOKEN" }

# Token factory for `gondr token` (macOS). This is the default path of factory/bin/install.
# [factory]
# binary = "~/.local/share/gondr/gondr-factory"

# A client's repos keep their own secrets and vaults.
# [[boundary]]
# name = "Acme"
# dir = "~/repos/acme"
# prefix = "/repos/acme"
# shared = "/repos/acme/tooling"
# vault_prefix = "acme"
# allow_vaults = ["shared"]
# deny_agents = ["some-agent"]

# Services for `gondr onboard`. Leave out hosts, auth and key to take them from `agent-vault catalog --json`.
[services.openai]
hosts = ["api.openai.com"]
auth = "bearer"
key = "OPENAI_API_KEY"
shared = "${dev.shared.vendors.openai.OPENAI_API_KEY}"
project_keys = ["OPENAI_API_KEY"]

[services.anthropic]
shared = "${dev.shared.vendors.anthropic.ANTHROPIC_API_KEY}"
